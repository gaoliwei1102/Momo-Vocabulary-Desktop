name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/adapter/package-lock.json
      - name: Build native app
        run: dotnet build src/WordBubble/WordBubble.csproj -c Release
      - name: Check native logic
        run: dotnet run --project tests/WordBubble.Tests/WordBubble.Tests.csproj -c Release
      - name: Install test dependencies
        run: npm ci
        working-directory: tests/adapter
      - name: Check website adapters with synthetic data
        run: npm test
        working-directory: tests/adapter
      - name: Check native flow and render sample previews
        run: dotnet run --project scripts/PreviewRenderer/PreviewRenderer.csproj -c Release -- artifacts/native-preview
